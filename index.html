<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cosplay Chess - Rubra Studios</title>
    <link rel="icon" type="image/png" href="img/favicon-Photoroom.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loader">
    <div class="loader-content">
        <img src="img/favicon-Photoroom.png" alt="Rubra Studios Logo" class="loader-logo">
        <div class="loading-bar"><div class="progress"></div></div>
        <p style="font-size: 11px; letter-spacing: 1px; margin-top: 10px;">CARREGANDO RUBRA STUDIOS...</p>
    </div>
</div>

<div id="menu-toggle" onclick="toggleMenu()">🏠</div>

<aside id="sidebar">
    <div style="padding: 20px; border-bottom: 1px solid #222;">
        <h2 style="color:var(--accent); letter-spacing: 1px;">Cosplay Chess</h2>
        <div style="display:flex; flex-direction:column; gap:8px; margin-top:10px">
            <label style="font-size: 12px; cursor: pointer;"><input type="checkbox" id="edit-mode" onchange="renderBoard()"> MODO EDIÇÃO (UPLOAD/REMOVER)</label>
            <label style="font-size: 12px; color: var(--accent); font-weight:bold; cursor: pointer;"><input type="checkbox" id="free-move"> MOVIMENTAÇÃO LIVRE</label>
        </div>
    </div>
    <div class="tabs">
        <button id="t-white" class="active" onclick="showTab('white')">BRANCAS</button>
        <button id="t-black" onclick="showTab('black')">PRETAS</button>
        <button id="t-sys" onclick="showTab('sys')">SISTEMA</button>
    </div>
    
    <div class="scroll-area" id="list-white"></div>
    <div class="scroll-area" id="list-black" style="display:none"></div>
    
    <div class="scroll-area" id="list-sys" style="display:none">
        <div class="unit-card">
            <b style="font-size: 11px;">VOLUME MESTRE</b>
            <input type="range" id="v-master" min="0" max="1" step="0.1" value="1" style="width:100%" oninput="updateMasterVolume()">
        </div>
        <div class="unit-card">
            <b style="color: var(--accent); font-size: 11px;">🎶 ÁUDIO AMBIENTE</b>
            <div id="ambient-controls" style="margin-top:10px; display: flex; flex-direction: column; gap: 12px;"></div>
        </div>
        <button class="btn" onclick="rollInitiative()" style="background:#1c1c24; color:var(--accent); margin-bottom: 8px;">🎲 SORTEAR INÍCIO</button>
        <button class="btn" onclick="clearBoardPieces()" style="background:#222; color:#fff; margin-bottom: 8px;">🧹 LIMPAR TABULEIRO</button>
        <button class="btn" onclick="resetGame()" style="background:var(--danger); color:#fff;">⚠️ RESET TOTAL</button>
    </div>
    
    <div style="padding: 15px; background: #000; border-top: 1px solid #222;">
        <button class="btn btn-yes" style="width: 100%; padding: 12px; font-weight: 900;" onclick="startBattle()">ATIVAR BATALHA</button>
    </div>
</aside>

<div class="app-container">
    <div id="dashboard">
        <div id="card-B" class="player-card">
            <div id="img-B" class="p-img" onclick="document.getElementById('f-av-B').click()" title="Mudar Avatar"></div>
            <input type="file" id="f-av-B" style="display:none" onchange="upAvatar('B', this)">
            <input type="text" id="name-B" value="Jogador 1" class="player-name-input" style="color:#00e5ff">
            <div id="score-B" class="p-score">0</div>
        </div>
        
        <div style="display: flex; align-items: center; color: #333; font-weight: 900; font-size: 14px; padding: 0 10px;">VS</div>
        
        <div id="card-P" class="player-card" style="flex-direction: row-reverse; text-align: right;">
            <div id="img-P" class="p-img" onclick="document.getElementById('f-av-P').click()" title="Mudar Avatar"></div>
            <input type="text" id="name-P" value="Jogador 2" class="player-name-input" style="color:var(--danger); text-align: right;">
            <div id="score-P" class="p-score" style="color:var(--danger)">0</div>
            <input type="file" id="f-av-P" style="display:none" onchange="upAvatar('P', this)">
        </div>
    </div>
    
    <main>
        <div class="board-wrapper">
            <div class="coord-v"><div>8</div><div>7</div><div>6</div><div>5</div><div>4</div><div>3</div><div>2</div><div>1</div></div>
            <div id="board"></div>
            <div class="coord-h"><div>A</div><div>B</div><div>C</div><div>D</div><div>E</div><div>F</div><div>G</div><div>H</div></div>
            <input type="file" id="quick-upload" style="display:none" onchange="handleQuickUpload(this)">
        </div>

        <div class="graveyard-container">
            <h4 style="color:var(--accent); font-size:10px; font-weight:900; text-align:center; margin-bottom:12px; letter-spacing: 1px; border-bottom: 1px solid #222; padding-bottom: 6px;">ELIMINADOS</h4>
            <div id="graveyard"></div>
        </div>
    </main>
</div>

<div id="arena" class="overlay">
    <div class="arena-content">
        <div class="arena-fighters" style="display: flex; align-items: center; gap: 40px;">
            <div class="fighter">
                <div id="a-img" class="arena-box" style="border-color: var(--accent)"></div>
                <div class="arena-audio-btns">
                    <button id="btn-play-L" class="btn" style="background:#004444">▶</button>
                    <button id="btn-pause-L" class="btn" style="background:#440000">||</button>
                </div>
                <button class="btn btn-yes" onclick="finishDuel('B')" style="margin-top:10px; width: 100%;">VITÓRIA BRANCAS</button>
            </div>
            <div style="font-size: 28px;">⚔️</div>
            <div class="fighter">
                <div id="d-img" class="arena-box" style="border-color: var(--danger)"></div>
                <div class="arena-audio-btns">
                    <button id="btn-play-R" class="btn" style="background:#004444">▶</button>
                    <button id="btn-pause-R" class="btn" style="background:#440000">||</button>
                </div>
                <button class="btn" onclick="finishDuel('P')" style="background:var(--danger); color:#fff; margin-top:10px; width: 100%;">VITÓRIA PRETAS</button>
            </div>
        </div>
        <div style="text-align: center; margin-top: 20px;">
            <button class="btn" onclick="closeArena()" style="background:#222; width: 120px;">CANCELAR</button>
        </div>
    </div>
</div>

<div id="victory-modal" class="overlay">
    <div class="victory-content">
        <div class="trophy-wrap">
            <div id="victory-photo" class="winner-photo-circle"></div>
        </div>
        <h1 style="color:var(--gold); letter-spacing: 1px; margin-bottom: 5px;">CAMPEÃO!</h1>
        <p id="winner-name" style="font-weight: bold; font-size: 1.2em; color: #fff;"></p>
        <button class="btn btn-yes" onclick="location.reload()" style="width:200px; margin-top:25px; padding: 12px; font-weight: 900;">REINICIAR</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
